name: Validate recovered Unity project

on:
  push:
    branches: [main]
    paths:
      - 'UnityProject/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-recovered-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify original Unity version and scenes
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < UnityProject/ProjectSettings/ProjectVersion.txt)" = 'm_EditorVersion: 4.5.5f1'
          test -s UnityProject/Assets/Scenes/SplashScene.unity
          test -s UnityProject/Assets/Scenes/PlayScene.unity
          test -s UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'Assets/Scenes/SplashScene.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
          grep -q 'Assets/Scenes/PlayScene.unity' UnityProject/ProjectSettings/EditorBuildSettings.asset
      - name: Verify recovered original assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find UnityProject/Assets -type f -name '*.prefab' | wc -l)" -ge 50
          test "$(find UnityProject/Assets/Scripts/Assembly-CSharp -type f -name '*.cs' | wc -l)" -ge 300
          test "$(find UnityProject/Assets/Resources -maxdepth 1 -type f | wc -l)" -ge 80
          test "$(find UnityProject/Assets/AudioClip -type f | wc -l)" -ge 15
          echo 'Unity 4.5.5f1 project structure and recovered assets verified.'
          echo 'This check does not claim a Windows player build; that requires running the legacy Unity editor.'
